:root{--g9:#0f4d33;--g7:#1f7a4f;--g5:#3fa573;--g1:#e8f4ec;--gold:#c9a24a;--bg:#fcfdfb;--ink:#17301f;--card:#fff;--line:#dcebe1;--mute:#5d7466;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a13;--ink:#e8f2ea;--card:#14261c;--line:#24402f;--mute:#9bb5a4;--g1:#183024;--g9:#8fd4ae;--g7:#5fc08f}}
:root[data-theme="dark"]{--bg:#0d1a13;--ink:#e8f2ea;--card:#14261c;--line:#24402f;--mute:#9bb5a4;--g1:#183024;--g9:#8fd4ae;--g7:#5fc08f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7}
header{text-align:center;padding:56px 20px 8px}
.logo{width:76px;height:76px;object-fit:contain;border-radius:18px;background:#fff;padding:6px;box-shadow:0 0 0 1px var(--line)}
h1{font-size:clamp(30px,6vw,56px);font-weight:800;color:var(--g7);margin:18px 0 0;line-height:1.3}
.rule{width:120px;height:3px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
main{max-width:1100px;margin:0 auto;padding:36px 20px 20px}
h2{font-size:clamp(22px,4vw,32px);font-weight:700;text-align:center;margin:0 0 22px}
.search{display:block;width:min(420px,100%);margin:0 auto 30px;padding:13px 20px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:500 16px Tajawal,sans-serif;text-align:right}
.search:focus{outline:3px solid var(--g5);border-color:var(--g5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:700 17px Tajawal,sans-serif;text-align:right;cursor:pointer;transition:border-color .15s,transform .15s}
.card::before{content:"★";color:var(--gold);font-size:15px}
.card:hover{border-color:var(--g5);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--g5)}
.empty{text-align:center;color:var(--mute);margin:20px 0;display:none}
footer{max-width:640px;margin:40px auto 0;padding:40px 20px 64px;text-align:center;border-top:1px solid var(--line)}
footer p{margin:0 0 12px;font-size:18px}
footer .last{font-size:24px;font-weight:800;color:var(--g7)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(10,30,20,.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;padding:16px;overflow:auto}
#ov.on{display:flex}
#stage{position:relative;flex:none}
#stage .cert{position:absolute;top:0;left:0;transform-origin:top left}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:11px 22px;border-radius:999px;border:0;font:700 16px Tajawal,sans-serif;cursor:pointer;background:#fff;color:#0f4d33}
.btn.p{background:#1f7a4f;color:#fff}
.btn:focus-visible{outline:3px solid #c9a24a}
.btn[disabled]{opacity:.6;cursor:wait}
/* certificate: fixed A4 landscape at 96dpi */
.cert{width:1123px;height:794px;background:#f6f8fc;color:#0b4a47;font-family:Tajawal,Tahoma,sans-serif;direction:rtl;position:relative;overflow:hidden}
.cert svg{position:absolute;inset:0;width:1123px;height:794px}
.cert .a{position:absolute}
.cert .logo2{left:80px;top:52px;width:60px;height:60px;object-fit:contain}
.cert .ttl{left:0;right:0;top:140px;font-family:'Aref Ruqaa',Tajawal,serif;font-size:92px;font-weight:700;color:#a9701a;line-height:1.25;direction:rtl;text-align:center}
.cert .sub{left:0;right:0;top:296px;text-align:center;font-size:24px;font-weight:700;color:#0b4a47}
.cert .nmw{left:0;right:0;top:332px;text-align:center}
.cert .nm{display:inline-block;font-family:'Aref Ruqaa',Tajawal,serif;font-weight:700;color:#a9701a;padding:0 60px 4px;border-bottom:3px solid #1f6b66;white-space:nowrap;line-height:1.5;min-width:560px}
.cert .tx{left:200px;right:200px;top:452px;text-align:center;font-size:22px;line-height:1.8;color:#0b4a47}
.cert .hero{left:0;right:0;top:520px;text-align:center;font-size:32px;font-weight:800;color:#a9701a}
.cert .wish{left:0;right:0;top:566px;text-align:center;font-size:21px;color:#0b4a47}
.cert .ln{top:690px;width:190px;border-top:2px solid #1f6b66}
.cert .lb.dt{top:654px;font-size:22px}
.cert .lb.sg{top:690px;font-family:'Great Vibes',cursive;font-size:38px;font-weight:400;white-space:nowrap;line-height:1.4}
.cert .lb{top:700px;width:190px;text-align:center;font-size:19px;font-weight:700;color:#0b4a47;direction:ltr}
.cert .medal{left:506px;top:630px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbe58a,#c8951f);box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 0 0 4px #efce63;display:flex;align-items:center;justify-content:center}
.cert .mi{width:78px;height:78px;border-radius:50%;background:#fff;border:3px solid #0e6b5f;display:flex;align-items:center;justify-content:center}
.cert .mi img{width:58px;height:58px;object-fit:contain}
.cert .mi i{font-style:normal;font-size:18px}
#capture{position:fixed;left:-20000px;top:0}
@media print{
@page{size:A4 landscape;margin:0}
body>*:not(#capture){display:none!important}
#capture{position:static!important;left:0}
html,body{background:#fff}
}

function mk(s){var d=document.createElement('div');d.className='cert';d.innerHTML=certHTML(s);return d}

var grid=document.getElementById('grid'),q=document.getElementById('q'),empty=document.getElementById('empty');
S.forEach(function(s){
var b=document.createElement('button');b.className='card';b.type='button';b.textContent=s.name;b.dataset.id=s.id;
b.addEventListener('click',function(){openCert(s)});grid.appendChild(b);
});
function norm(t){return t.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[\u064B-\u0652]/g,'').trim().toLowerCase()}
q.addEventListener('input',function(){
var v=norm(q.value),n=0;
Array.prototype.forEach.call(grid.children,function(c){var ok=norm(c.textContent).indexOf(v)>-1;c.style.display=ok?'':'none';if(ok)n++});
empty.style.display=n?'none':'block';
});

var ov=document.getElementById('ov'),stage=document.getElementById('stage'),cap=document.getElementById('capture'),cur=null,last=null;
function fit(){
var c=stage.firstChild;if(!c)return;
var s=Math.min((innerWidth-32)/1123,(innerHeight-140)/794);
c.style.transform='scale('+s+')';stage.style.width=1123*s+'px';stage.style.height=794*s+'px';
}
function openCert(s){
cur=s;last=document.activeElement;
stage.innerHTML='';stage.appendChild(mk(s));
cap.innerHTML='';cap.appendChild(mk(s));
ov.classList.add('on');fit();document.getElementById('cl').focus();
}
function closeCert(){ov.classList.remove('on');if(last)last.focus()}
document.getElementById('cl').onclick=closeCert;
ov.addEventListener('click',function(e){if(e.target===ov)closeCert()});
addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on'))closeCert()});
addEventListener('resize',fit);
document.getElementById('pr').onclick=function(){document.fonts.ready.then(function(){window.print()})};
document.getElementById('dl').onclick=function(){
var b=this;if(!cur)return;b.disabled=true;var old=b.textContent;b.textContent='جاري التحضير...';
document.fonts.ready.then(function(){
return html2canvas(cap.firstChild,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,width:1123,height:794,windowWidth:1123});
}).then(function(cv){
var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,297,210);
pdf.save('شهادة تقدير - '+cur.name+'.pdf');
}).catch(function(){alert('حصلت مشكلة في التحميل، جرّب تاني أو استخدم زر الطباعة واحفظ كـ PDF')}).then(function(){b.disabled=false;b.textContent=old});
};
